<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript DOM</title>
</head>
<body>
    <!--hello this is DOM Demo -->
    <h1>hello js !!
        <div>box0</div>
        <p>anamika</p>
    </h1>
    <div>box</div>
    <script>
        document.title="DOM";
        console.log(document.body);
        console.log(document.title)
         console.log(document.head);
         document.body.style.background="blue";
         //console.log
         console.log(document);
         //console.dir
         console.dir(document);
         //childNodes
         console.log(document.body.childNodes);
         console.log(document.body.childNodes[0]);
         console.log(document.body.childNodes[0].childNodes);
         console.log(document.body.firstChild);
         console.log(document.body.firstElementChild);
         console.log(document.body.lastChild);
         console.log(document.body.lastElementChild);
         console.log(document.body.firstChild.nextSibling);
         console.log(document.body.lastElementChild.previousElementSibling);
          console.log(document.body.lastChild.parentElement);
          console.log(document.body.firstElementChild.childNodes);
         console.log(document.body.firstElementChild.children);
         console.log(document.body.firstElementChild.children[1]);
         console.log(document.body.firstElementChild.children[1].previousElementSibling);
         console.log(document.body.firstElementChild.children[1].nextElementSibling);
         console.log(document.body.firstElementChild.children[1].previousSibling);
         console.log(document.body.firstElementChild.children[1].nextSibling);
    </script>
</body>
</html>
