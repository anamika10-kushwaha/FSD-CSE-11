<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom html</title>
</head>
<body>
    <h1><center>dom demo</center></h1><br>
    <button id="btn">add paragraph</button>
    <div id="red">

    </div>
    <button id="btn1">remove paragraph</button>
    <button id="btn2">remove all paragraphs</button>
    <script>
        let btn=document.getElementById("btn");
        btn.onclick=function(){
            let para=document.createElement("p");
            para.innerText="this is paragraph";
            para.style.color="blue";
            let div=document.getElementById("red");
            div.appendChild(para);
        }
        let btn1=document.getElementById("btn1");
        btn1.onclick=function(){
            let p=document.querySelector("p");
             let div=document.getElementById("red");
            div.removeChild(p);
        }
        let btn2=document.getElementById("btn2");
        btn2.onclick=function(){
            let p=document.querySelectorAll("p");
             let div=document.getElementById("red");
            // div.removeElement(p);
            p.forEach(element => {
               div.removeChild(element); 
            });
        }
    </script>
</body>
</html>
